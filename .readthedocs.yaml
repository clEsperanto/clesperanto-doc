# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "mambaforge-latest"
  jobs:
    pre_install:
      - bash scripts/fetch_sources.sh
      - bash scripts/doxygen_clic.sh
      # batch mode, sequential downloads and retries: parallel downloads from
      # Maven Central intermittently fail with TLS "handshake_failure" on RTD
      - >-
        cd _submodules/clesperantoj &&
        MVN="mvn -B -ntp -Pdoxygen -Daether.connector.basic.threads=1 -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.interval=5000" &&
        ($MVN site || (sleep 30 && $MVN site))

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: ./conf.py

conda:
  environment: ./environment.yml   

        
