# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "mambaforge-latest"
  jobs:
    pre_install:
      - git clone -b 0.19.0 --single-branch https://github.com/clEsperanto/CLIc.git _submodules/clic
      - cmake -S _submodules/clic/docs -B _submodules/clic/docs/build
      - cmake --build _submodules/clic/docs/build --target doxygen
      - git clone -b 0.19.0 --single-branch https://github.com/clEsperanto/pyclesperanto.git _submodules/pyclesperanto

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: ./conf.py

conda:
  environment: ./environment.yml   

        
