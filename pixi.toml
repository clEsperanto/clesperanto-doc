[workspace]
authors = ["Stephane Rigaud <stephane.rigaud@pasteur.fr>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "clesperanto-doc"
platforms = ["linux-64", "osx-64", "win-64", "osx-arm64"]
version = "0.1.0"

[tasks]
clone = { cmd = "bash scripts/fetch_sources.sh" }
clean = { cmd = "test -d _submodules && rm -rf _submodules/* || true; make clean" }
doxygen_c = { cmd = "bash scripts/doxygen_clic.sh" }
doxygen_j = { cmd= "cd ./_submodules/clesperantoj && mvn clean && mvn -Pdoxygen site -DskipTests" }
build = { cmd = "make html", depends-on = ["clean", "clone", "doxygen_c", "doxygen_j"] }
export = { cmd = "pixi workspace export conda-environment -p linux-64 environment.yml" }

[dependencies]
sphinx = ">=8.1.3,<9"
breathe = ">=4.35.0,<5"
doxygen = ">=1.9.8,<1.11"
sphinx-copybutton = ">=0.5.2,<0.6"
furo = ">=2024.8.6,<2026"
sphinx-inline-tabs = ">=2023.4.21,<2026"
maven = ">=3.9.6,<4"
toolz = ">=1.2.0,<2"

[pypi-dependencies]
sphinxemoji = "~=0.3.1"
sphinxext-opengraph = { version = "*", extras = ["social-cards"] }
