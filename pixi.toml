[workspace]
authors = ["Stephane Rigaud <stephane.rigaud@pasteur.fr>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "clesperanto-doc"
platforms = ["linux-64", "osx-64", "win-64", "osx-arm64"]
version = "0.1.0"

[tasks]
clone = { cmd = "git clone -b master https://github.com/clEsperanto/clic.git ./_submodules/clic && git clone -b main https://github.com/clEsperanto/pyclesperanto ./_submodules/pyclesperanto &&  git clone -b main https://github.com/clEsperanto/clesperantoj_prototype ./_submodules/clesperantoj" } 
clean = { cmd = "test -d _submodules && rm -rf _submodules/* || true; make clean" }
doxygen_c = { cmd= "cmake -S ./_submodules/clic/docs -B ./_submodules/clic/docs/build && cmake --build ./_submodules/clic/docs/build --target doxygen" }
doxygen_j = { cmd= "cd ./_submodules/clesperantoj && mvn clean && mvn -Pdoxygen site -DskipTests" }
build = { cmd = "make html", depends-on = ["clean", "clone", "doxygen_c", "doxygen_j"] }
export = { cmd = "pixi project export conda-environment -p linux-64 environment.yml" }

[dependencies]
sphinx = ">=8.1.3,<9"
breathe = ">=4.35.0,<5"
cmake = ">=3.31.4,<4"
doxygen = ">=1.12.0,<2"
sphinx-copybutton = ">=0.5.2,<0.6"
furo = ">=2024.8.6,<2026"
sphinx-inline-tabs = ">=2023.4.21,<2026"
maven = ">=3.9.6,<4"

[pypi-dependencies]
sphinxemoji = "~=0.3.1"
sphinxext-opengraph = { version = "*", extras = ["social-cards"] }
